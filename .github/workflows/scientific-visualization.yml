name: SciCal scientific visualization checks

on:
  push:
    branches:
      - feature/scientific-visualization-v24
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    name: Domain and contract tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: .
  typescript:
    name: Strict TypeScript, scene unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
