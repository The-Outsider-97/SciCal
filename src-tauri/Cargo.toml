[package]
name = "scical"
version = "2.4.0"
description = "SLAI SciCal - a scientific calculator and STEM workbench"
authors = ["SLAI"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "scical_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
